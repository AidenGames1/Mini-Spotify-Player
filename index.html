<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curvele Spotify Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <div>
        <p class="eyebrow">curvele.cc</p>
        <h1>Spotify Player</h1>
        <p class="subtext">Log in, pick one of your playlists, and play it from this page.</p>
      </div>

      <div class="auth-card">
        <button id="loginBtn" class="primary">Log in with Spotify</button>
        <button id="logoutBtn" class="secondary hidden">Log out</button>
        <p id="userInfo" class="small"></p>
      </div>
    </section>

    <section id="statusBox" class="status">
      Waiting for Spotify login.
    </section>

    <section class="player-card">
      <div class="now-playing">
        <img id="albumArt" src="" alt="" class="album-art hidden" />
        <div>
          <p class="small">Now playing</p>
          <h2 id="trackName">Nothing yet</h2>
          <p id="artistName" class="muted">Choose a playlist to start.</p>
        </div>
      </div>

      <div class="controls">
        <button id="prevBtn" class="round">⏮</button>
        <button id="playPauseBtn" class="round large">▶</button>
        <button id="nextBtn" class="round">⏭</button>
      </div>

      <div class="device-row">
        <span class="dot"></span>
        <span id="deviceStatus">Spotify device not ready</span>
      </div>
    </section>

    <section class="section-head">
      <div>
        <h2>Your Playlists</h2>
        <p class="muted">Click a playlist to start playing it.</p>
      </div>
      <button id="refreshBtn" class="secondary hidden">Refresh</button>
    </section>

    <section id="playlistGrid" class="playlist-grid"></section>
  </main>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="app.js"></script>
</body>
</html>
